<div class="register-page">

  <div class="register-card">

    <div class="logo">
      <div class="logo-icon">C</div>
      <span>CyberWatch</span>
    </div>

    <p class="eyebrow">
      SECURITY OPERATIONS CENTER
    </p>

    <h1>Create your account</h1>

    <p class="subtitle">
      Join CyberWatch and start monitoring security incidents.
    </p>

    <form (ngSubmit)="register()">

      <div class="name-row">

        <div class="form-group">
          <label for="firstName">First name</label>

          <input
            id="firstName"
            type="text"
            name="firstName"
            [(ngModel)]="firstName"
            placeholder="Catherine"
            required
          >
        </div>

        <div class="form-group">
          <label for="lastName">Last name</label>

          <input
            id="lastName"
            type="text"
            name="lastName"
            [(ngModel)]="lastName"
            placeholder="Ngango"
            required
          >
        </div>

      </div>

      <div class="form-group">
        <label for="email">Email address</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="analyst@cyberwatch.local"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Create a password"
          required
        >
      </div>

      <p
        *ngIf="errorMessage"
        class="error-message"
      >
        {{ errorMessage }}
      </p>

      <button
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>

    </form>

    <p class="login-link">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>

  </div>

</div>
